version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(actions):"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    versioning-strategy: widen
    ignore:
      # ncc 0.45's embedded ts-loader cannot load the TypeScript 7 compiler API.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Keep compile-time APIs aligned with the actual node24 action runtime.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "deps(npm):"
